<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loop">
  <meta name="theme-color" content="#111111">
  <title>Loop Trimmer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Loop Trimmer</h1>
    <span id="version">v0.3</span>
  </header>

  <main id="app">
    <div id="video-container">
      <video id="video" playsinline></video>
    </div>

    <!-- Nouvelle zone Timeline -->
    <div id="timeline-section">
      <div id="time-display">00:00.0</div>
      <canvas id="timeline-canvas"></canvas>
    </div>

    <div id="controls">
      <label for="file-input" class="btn">📁 Choisir</label>
      <input type="file" id="file-input" accept="video/*" hidden>
      <button id="play-btn" class="btn secondary" disabled>▶️ Play</button>
    </div>
  </main>

  <footer>
    <p id="status">En attente d'un clip</p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
