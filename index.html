<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loop">
  <meta name="theme-color" content="#111111">
  <title>Loop Trimmer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Loop Trimmer</h1>
    <span id="version">v0.6</span>
  </header>

  <main id="app">
    <div id="video-container">
      <video id="video" playsinline></video>
    </div>

    <div id="timeline-section">
      <div id="time-display">00:00.0 / 00:00.0</div>
      <canvas id="timeline-canvas"></canvas>
    </div>

    <!-- Zone de contrôle du BPM et des mesures -->
    <div id="bpm-controls">
      <div class="control-group">
        <label>BPM</label>
        <input type="number" id="bpm-input" value="90" min="30" max="300">
      </div>
      
      <div class="control-group">
        <label class="toggle-label">
          <input type="checkbox" id="magnetic-toggle" checked>
          Aimant
        </label>
      </div>

      <div class="control-group">
        <button id="btn-4m" class="btn small active">4 Mesures</button>
        <button id="btn-8m" class="btn small">8 Mesures</button>
      </div>
    </div>

    <div id="controls">
      <label for="file-input" class="btn secondary">📁</label>
      <input type="file" id="file-input" accept="video/*" hidden>
      
      <button id="play-btn" class="btn secondary" disabled>▶️ Play</button>
      <button id="loop-play-btn" class="btn primary" disabled>🔁 Boucle</button>
    </div>
  </main>

  <footer>
    <p id="status">En attente d'un clip</p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
